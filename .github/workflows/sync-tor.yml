name: Sync Tor Upstream & MR Branches

on:
  schedule:
    - cron: '17 */2 * * *' # Every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run git pushes without modifying remote refs'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [sync-tor]

permissions:
  contents: read
  actions: write # Resets GitHub's 60-day cron inactivity timer on dedicated sync repos

concurrency:
  group: sync-tor-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream -> 1aeo/tor & GitLab fork, and mr/* -> GitLab fork
        env:
          GH_PAT: ${{ secrets.TOR_SYNC_GITHUB_PAT }}
          GH_REPO: ${{ vars.TOR_GITHUB_REPO || '1aeo/tor' }}
          GL_USER: ${{ secrets.TOR_GITLAB_USER }}
          GL_PAT: ${{ secrets.TOR_SYNC_GITLAB_PAT }}
          GL_FORK_PATH: ${{ vars.TOR_GITLAB_FORK_PATH || secrets.TOR_GITLAB_FORK_PATH }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::Missing secret TOR_SYNC_GITHUB_PAT (fine-grained PAT for ${GH_REPO} with Contents: Read and write)."
            exit 1
          fi
          if [[ ! "$GH_REPO" =~ ^1aeo/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::TOR_GITHUB_REPO must name a repository owned by 1aeo."
            exit 1
          fi

          DRY_FLAG=""
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "Running in --dry-run mode"
          fi

          git init --bare tor-sync.git
          cd tor-sync.git

          git remote add upstream "https://gitlab.torproject.org/tpo/core/tor.git"
          git remote add github "https://github.com/${GH_REPO}.git"

          # 1. Fetch upstream branches & tags anonymously (skips GitLab internal refs/merge-requests/* & keep-around/*)
          echo "Fetching upstream tpo/core/tor..."
          git fetch --prune upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/heads/maint-*:refs/remotes/upstream/maint-*' \
            '+refs/heads/release-*:refs/remotes/upstream/release-*' \
            '+refs/tags/*:refs/tags/*'

          # 2. Authenticate to GitHub via HTTP header (never embed tokens in remote URLs) and update 1aeo/tor
          GH_AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')
          echo "::add-mask::${GH_AUTH}"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${GH_AUTH}"

          echo "Syncing upstream refs -> github:${GH_REPO}..."
          git push ${DRY_FLAG:+"$DRY_FLAG"} github \
            '+refs/remotes/upstream/main:refs/heads/main' \
            '+refs/remotes/upstream/maint-*:refs/heads/maint-*' \
            '+refs/remotes/upstream/release-*:refs/heads/release-*' \
            '+refs/tags/*:refs/tags/*'

          # 3. If GitLab fork secrets are configured, sync upstream + opt-in `mr/*` branches -> GitLab fork
          GL_FORK_CLEAN="${GL_FORK_PATH:-}"
          GL_FORK_CLEAN="${GL_FORK_CLEAN#https://gitlab.torproject.org/}"
          GL_FORK_CLEAN="${GL_FORK_CLEAN#http://gitlab.torproject.org/}"
          GL_FORK_CLEAN="${GL_FORK_CLEAN#/}"
          GL_FORK_CLEAN="${GL_FORK_CLEAN%/}"
          GL_FORK_CLEAN="${GL_FORK_CLEAN%.git}"

          if [ -z "${GL_FORK_CLEAN}" ] || [ -z "${GL_PAT:-}" ]; then
            echo "::notice::TOR_GITLAB_FORK_PATH / TOR_SYNC_GITLAB_PAT not configured yet — synced upstream -> ${GH_REPO}; skipping GitLab fork sync."
            exit 0
          fi

          if [[ ! "$GL_FORK_CLEAN" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)+$ ]] ||
             [[ "${GL_FORK_CLEAN,,}" == "tpo/core/tor" ]]; then
            echo "::error::TOR_GITLAB_FORK_PATH must name a fork namespace/repository, never tpo/core/tor."
            exit 1
          fi

          GL_AUTH_USER="${GL_USER:-oauth2}"
          GL_AUTH=$(printf '%s:%s' "$GL_AUTH_USER" "$GL_PAT" | base64 | tr -d '\n')
          echo "::add-mask::${GL_AUTH}"
          git config "http.https://gitlab.torproject.org/.extraheader" "AUTHORIZATION: basic ${GL_AUTH}"
          git remote add gitlab "https://gitlab.torproject.org/${GL_FORK_CLEAN}.git"

          echo "Syncing upstream refs -> gitlab:${GL_FORK_CLEAN}..."
          git push ${DRY_FLAG:+"$DRY_FLAG"} gitlab \
            '+refs/remotes/upstream/main:refs/heads/main' \
            '+refs/remotes/upstream/maint-*:refs/heads/maint-*' \
            '+refs/remotes/upstream/release-*:refs/heads/release-*' \
            '+refs/tags/*:refs/tags/*'

          echo "Checking github:${GH_REPO} for mr/* branches..."
          git fetch --prune github '+refs/heads/mr/*:refs/remotes/github-mr/*'
          mr_failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            ref="refs/remotes/github-mr/${branch}"

            case "$branch" in
              main|HEAD|maint-*|release-*)
                echo "::error::Refusing reserved mr/* branch name '${branch}'"
                mr_failed=1
                continue
                ;;
            esac

            best_mb=""
            best_count=999999999
            while IFS= read -r up; do
              [ -z "$up" ] && continue
              mb=$(git merge-base "$up" "$ref" || true)
              [ -n "$mb" ] || continue
              cnt=$(git rev-list --count "${mb}..${ref}")
              if [ "$cnt" -lt "$best_count" ]; then
                best_count="$cnt"
                best_mb="$mb"
              fi
            done < <(git for-each-ref --format='%(refname)' 'refs/remotes/upstream/main' 'refs/remotes/upstream/maint-*')

            if [ -z "$best_mb" ] || [ "$best_count" -eq 0 ]; then
              echo "::error::mr/${branch}: no commits ahead of upstream main/maint-*"
              mr_failed=1
              continue
            fi

            branched_from_release=0
            while IFS= read -r rel; do
              [ -z "$rel" ] && continue
              rel_mb=$(git merge-base "$rel" "$ref" || true)
              if [ -n "$rel_mb" ] && [ "$rel_mb" != "$best_mb" ] && git merge-base --is-ancestor "$best_mb" "$rel_mb"; then
                branched_from_release=1
                break
              fi
            done < <(git for-each-ref --format='%(refname)' 'refs/remotes/upstream/release-*')
            if [ "$branched_from_release" -eq 1 ]; then
              echo "::error::mr/${branch}: appears branched from release-* or release tag instead of main/maint-*"
              mr_failed=1
              continue
            fi

            # Inspect every outgoing commit, including content removed again later.
            # Do not echo offending content or identities into public CI logs.
            if ! python3 - "$best_mb" "$ref" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args])

          leak = re.compile(rb"/Users/|/home/|Mac-Studio|\.local>|Claude-Session:|Co-[Aa]uthored-[Bb]y:.*(?:Claude|Cursor|Antigravity|noreply@anthropic\.com|cursoragent@cursor\.com)")
          # PATCH-STACK.md commits 18/19 are private-canary-only, regardless of branch name.
          private_canary = re.compile(rb"relay_create_cell_source_total|relay_begindir_cell_source_total|relay_hsdir_fetch_descriptor_total")
          for sha in git("rev-list", f"{sys.argv[1]}..{sys.argv[2]}").split():
              sha = sha.decode("ascii")
              identity = git("show", "-s", "--format=%an <%ae>%n%cn <%ce>", sha).splitlines()
              if identity != [b"1aeo <github@1aeo.com>"] * 2:
                  sys.exit(f"::error::Commit {sha}: invalid author/committer identity")
              if leak.search(git("show", "-s", "--format=%B", sha)):
                  sys.exit(f"::error::Commit {sha}: private metadata in commit message")
              parents = git("show", "-s", "--format=%P", sha).decode().split()
              if not parents:
                  parents = [subprocess.check_output(["git", "hash-object", "-w", "-t", "tree", "--stdin"], input=b"").decode().strip()]
              for parent in parents:
                  for raw in git("diff", "--name-only", "--no-renames", "--diff-filter=ACMT", "-z", parent, sha).split(b"\0"):
                      path = pathlib.PurePosixPath(raw.decode("utf-8", "surrogateescape"))
                      if set(path.parts) & {"AGENTS.md", "CLAUDE.md", ".claude", ".cursor", ".gemini", ".codex"} or path.suffix.lower() in {".csv", ".npz", ".deb", ".ddeb"} or path.name.startswith("perf.data") or ".pcap" in path.name.lower():
                          sys.exit(f"::error::Commit {sha}: forbidden agent or raw artifact path")
                  diff = git("diff", "--text", "--no-ext-diff", "--no-textconv", "--no-renames", "-U0", parent, sha)
                  in_hunk = False
                  for line in diff.splitlines():
                      if line.startswith(b"diff --git "):
                          in_hunk = False
                      elif line.startswith(b"@@"):
                          in_hunk = True
                      elif in_hunk and line.startswith(b"+"):
                          if private_canary.search(line[1:]):
                              sys.exit(f"::error::Commit {sha}: private-canary-only instrumentation cannot be upstreamed")
                          if leak.search(line[1:]):
                              sys.exit(f"::error::Commit {sha}: private metadata in added content")
          PY
            then
              mr_failed=1
              continue
            fi

            wt_dir="${RUNNER_TEMP}/mr-check"
            checks_dir="$(mktemp -d "${RUNNER_TEMP}/tor-checks.XXXXXX")"
            # Run trusted upstream validators, never executable code from the MR.
            git archive "$best_mb" scripts/maint | tar -x -C "$checks_dir"
            git worktree add --detach "$wt_dir" "$ref"
            check_ok=1
            (
              cd "$wt_dir"
              # Validators read candidate files; keep links inside that snapshot.
              python3 -I - <<'PY' || exit 1
          import pathlib
          root = pathlib.Path.cwd()
          for path in root.rglob("*"):
              if path.is_symlink():
                  try:
                      path.resolve().relative_to(root)
                  except (ValueError, RuntimeError):
                      raise SystemExit("::error::MR contains an escaping or cyclic symlink")
          PY
              unset GH_PAT GH_AUTH GL_PAT GL_AUTH
              c_files=()
              while IFS= read -r f; do
                [ -n "$f" ] && c_files+=("$f")
              done < <(git diff --name-only --diff-filter=ACMR "${best_mb}..HEAD" -- '*.[ch]' '*.inc')
              if [ "${#c_files[@]}" -gt 0 ]; then
                perl "$checks_dir/scripts/maint/checkSpace.pl" -C "${c_files[@]}" || exit 1
              fi

              changes_files=()
              while IFS= read -r f; do
                [ -n "$f" ] && changes_files+=("$f")
              done < <(git diff --name-only --diff-filter=ACMR "${best_mb}..HEAD" -- 'changes/*')
              if [ "${#changes_files[@]}" -gt 0 ]; then
                python3 -I "$checks_dir/scripts/maint/lintChanges.py" "${changes_files[@]}" || exit 1
              fi

              python3 -I "$checks_dir/scripts/maint/practracker/includes.py" . || exit 1
            ) || check_ok=0
            git worktree remove --force "$wt_dir"
            rm -rf "$checks_dir"

            if [ "$check_ok" -ne 1 ]; then
              echo "::error::mr/${branch}: failed Tor maintainer checks (checkSpace/lintChanges/includes)"
              mr_failed=1
              continue
            fi

            echo "Syncing ${GH_REPO}:mr/${branch} -> gitlab:${GL_FORK_CLEAN}:${branch}"
            if ! git push ${DRY_FLAG:+"$DRY_FLAG"} gitlab "refs/remotes/github-mr/${branch}:refs/heads/${branch}"; then
              echo "::error::mr/${branch}: push failed; reconcile any GitLab-side changes before retrying. No forced MR updates."
              mr_failed=1
            fi
          done < <(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/github-mr/)

          if [ "$mr_failed" -ne 0 ]; then
            echo "::error::One or more mr/* branches failed pre-MR hygiene validation."
            exit 1
          fi

      - name: Reset 60-day scheduled workflow inactivity timer
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/sync-tor.yml/enable"
